<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5dfa2"/>
      <stop offset="50%" stop-color="#cfa858"/>
      <stop offset="100%" stop-color="#a47d30"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#cfa858" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#goldGlow)" fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Arch & Dome Frame -->
    <path d="M 40 120 L 40 70 A 40 40 0 0 1 120 70 L 120 120" stroke-width="5"/>
    
    <!-- Dome Crescent -->
    <path d="M 68 22 A 4 4 0 1 1 72 26" stroke-width="2.5" fill="none"/>
    <line x1="70" y1="26" x2="70" y2="30" stroke-width="2.5"/>

    <!-- Minaret (Right Side) -->
    <path d="M 105 60 L 105 25 L 111 15 L 117 25 L 117 60" stroke-width="3.5" fill="none"/>
    <line x1="102" y1="28" x2="120" y2="28" stroke-width="3"/>
    <line x1="103" y1="42" x2="119" y2="42" stroke-width="3"/>

    <!-- Amphitheater Tiered Arches (Concentric) -->
    <path d="M 46 80 A 34 34 0 0 1 114 80" stroke-width="4.5" stroke-dasharray="6 4"/>
    <path d="M 52 95 A 28 28 0 0 1 108 95" stroke-width="4.5" stroke-dasharray="6 4"/>
    <path d="M 58 110 A 22 22 0 0 1 102 110" stroke-width="4.5" stroke-dasharray="6 4"/>

    <!-- Inner Central Sun / Arch Base -->
    <path d="M 66 122 A 14 14 0 0 1 94 122" stroke-width="4"/>

    <!-- Sea Waves (Two Wavy Lines) -->
    <path d="M 38 134 Q 53 128, 68 134 T 98 134 T 122 134" stroke-width="4.5"/>
    <path d="M 38 146 Q 53 140, 68 146 T 98 146 T 122 146" stroke-width="4.5"/>
  </g>

  <!-- Typography -->
  <text x="80" y="166" font-family="'Cairo', sans-serif" font-size="13.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="0.5">مهرجان صيف جبلة</text>
  <text x="80" y="182" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="600" fill="#a9adb8" text-anchor="middle" letter-spacing="2">2026</text>
</svg>
